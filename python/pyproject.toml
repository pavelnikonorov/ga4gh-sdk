[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ga4gh-sdk-release-rehearsal"
description = "TestPyPI release rehearsal for GA4GH SDK Python bindings"
readme = { text = """
# GA4GH SDK for Python (TestPyPI rehearsal)

Python clients for GA4GH TES, WES, DRS, and Service Info APIs.

This is a TestPyPI rehearsal package. Install the production package as
`ga4gh-sdk` when it is released. Python imports use `ga4gh_sdk`.
For examples, supported Python APIs, and configuration, see the
[Python bindings guide](https://github.com/ga4gh/ga4gh-sdk/blob/main/python/README.md).
""", content-type = "text/markdown" }
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ga4gh/ga4gh-sdk"
Documentation = "https://github.com/ga4gh/ga4gh-sdk/blob/main/python/README.md"
Issues = "https://github.com/ga4gh/ga4gh-sdk/issues"

[project.optional-dependencies]
tests = [
    "pytest",
]

[tool.maturin]
bindings = "pyo3"
module-name = "ga4gh_sdk"
# Generate Python import libraries when cross-compiling for Windows, including aarch64.
features = ["pyo3/generate-import-lib"]
